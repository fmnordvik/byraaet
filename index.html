<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Byrået</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one game frame. HUD strip on top, pixel world in the middle, dialogue laid over the lower part of the world (stacked under it on phones). */
:root{
  color-scheme:dark;
  --ink:#0f1c26; --panel:#1a2f3d; --panel2:#234256; --line:#3d6079;
  --text:#e9f0ee; --muted:#9fb6c2; --amber:#f2b84b; --good:#6fcf8e; --bad:#ee7a6a;
  --paper:#f3ecd6; --paper-ink:#2a2a33; --paper-line:#b9ad8a;
  --display:'Pixelify Sans','Trebuchet MS',Verdana,sans-serif;
  --body:'VT323','Lucida Console','Courier New',monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:22px;line-height:1.15;
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
.wrap{margin:0 auto;display:flex;flex-direction:column;gap:10px;max-width:100%}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);border:3px solid var(--line);padding:8px 12px}
.clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.obj{flex:1 1 220px;min-width:0;color:var(--text)}
.obj b{font-weight:400;color:var(--muted)}
.meters{display:flex;flex-wrap:wrap;gap:6px 14px}
.meter{display:flex;align-items:center;gap:6px;font-size:19px;color:var(--muted);white-space:nowrap}
.bar{width:74px;height:12px;background:var(--ink);border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);transition:width .4s steps(8)}
.bar.low i{background:var(--bad)}
.meter.flash{color:var(--amber)}
.snd{font-family:var(--body);font-size:19px;background:var(--panel2);color:var(--text);border:2px solid var(--line);padding:2px 8px;cursor:pointer}
.stage{position:relative;border:3px solid var(--line);background:#000;box-shadow:6px 6px 0 rgba(0,0,0,.35);max-width:100%}
.stage canvas#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.hint{position:absolute;left:8px;top:8px;background:var(--ink);border:2px solid var(--amber);color:var(--amber);padding:1px 8px;font-size:20px;pointer-events:none}
.dialog{position:absolute;left:2%;right:2%;bottom:3%;display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:3px solid var(--text);
  padding:10px 12px;max-height:72%;overflow:auto;box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:3}
.dialog canvas{width:96px;height:96px;flex:none;image-rendering:pixelated;border:2px solid var(--line)}
.dbody{flex:1;min-width:0}
.dname{font-family:var(--display);font-weight:600;font-size:18px;color:var(--amber);margin-bottom:2px}
.dtext{min-height:2.3em;white-space:pre-wrap}
.dopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dnext{align-self:flex-end;flex:none}
.btn,.opt{font-family:var(--body);font-size:21px;line-height:1.1;cursor:pointer;border:2px solid var(--ink);padding:6px 12px}
.btn{background:var(--amber);color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.btn.sec{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.opt{background:var(--panel2);color:var(--text);border-color:var(--line);text-align:left}
.opt:hover,.opt:focus-visible{background:var(--line)}
.opt .k{color:var(--amber);margin-right:8px}
.opt.used{opacity:.45}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.panel{position:absolute;inset:0;overflow:auto;background:var(--ink);padding:18px clamp(14px,4%,42px);z-index:2}
.panel.veil{background:rgba(15,28,38,.80)}
.panel h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,7vw,60px);line-height:1;margin:0;color:var(--amber);letter-spacing:.04em;text-shadow:4px 4px 0 #000}
.panel h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 8px;color:var(--amber);text-wrap:balance}
.panel h3{font-family:var(--display);font-weight:600;font-size:19px;margin:14px 0 4px;color:var(--text)}
.panel p{margin:6px 0;max-width:68ch}
.panel .sub{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cols>*{min-width:0}
.cols .left{flex:1 1 260px}.cols .right{flex:1.2 1 300px}
input[type=text],textarea{font-family:var(--body);font-size:21px;background:var(--ink);color:var(--text);border:2px solid var(--line);padding:6px 8px;width:100%;max-width:560px}
textarea{min-height:110px;resize:vertical}
label{display:block;color:var(--muted);margin:8px 0 3px}
.paper{background:var(--paper);color:var(--paper-ink);padding:14px 16px;border:2px solid var(--paper-line);box-shadow:5px 5px 0 rgba(0,0,0,.45);transform:rotate(-.6deg);max-width:340px}
.paper .hd{font-family:var(--display);font-weight:700;font-size:20px}
.paper .ln{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--paper-line);padding:2px 0;font-variant-numeric:tabular-nums}
.paper .tot{font-weight:700;border-bottom:3px double var(--paper-ink)}
.paper .sm{font-size:18px;opacity:.8}
.note{background:#f7d774;color:#3a2f10;padding:8px 10px;margin-top:10px;transform:rotate(1.4deg);max-width:230px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.fb{border-left:4px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.fb.good{border-color:var(--good)}.fb.mid{border-color:var(--amber)}.fb.bad{border-color:var(--bad)}
.fb .v{font-family:var(--display);font-size:17px}
.fb.good .v{color:var(--good)}.fb.mid .v{color:var(--amber)}.fb.bad .v{color:var(--bad)}
.tag{display:inline-block;font-size:18px;color:var(--muted);border:1px solid var(--line);padding:0 6px;margin-top:4px}
.help{color:var(--muted);font-size:19px}
.count{color:var(--muted);font-size:18px}
.wrap.narrow .dialog{position:static;max-height:none;margin:0;border-width:3px 0 0;box-shadow:none}
.wrap.narrow .stage.has-panel canvas#cv,.wrap.narrow .stage.has-panel .hint{display:none}
.wrap.narrow .panel{position:static}
.wrap.narrow .dialog canvas{width:64px;height:64px}
.panel canvas#banner{display:block;width:min(100%,480px);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--line);margin-bottom:12px}
.tcols{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-start}
.tcols canvas#banner{flex:0 1 300px;width:300px;margin:0}
.tbody{flex:1 1 300px;min-width:0}
.tbody h1{font-size:clamp(32px,5vw,48px)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<main class="wrap" id="wrap">
  <header class="hud">
    <div class="clock" id="clock">MAN 08:00</div>
    <div class="obj" id="obj"><b>Mål:</b> Start arbeidsdagen</div>
    <div class="meters">
      <div class="meter" id="m-tillit">Kundetillit <span class="bar"><i style="width:50%"></i></span></div>
      <div class="meter" id="m-kvalitet">Faglig kvalitet <span class="bar"><i style="width:50%"></i></span></div>
      <div class="meter" id="m-integritet">Integritet <span class="bar"><i style="width:50%"></i></span></div>
    </div>
    <button class="snd" id="snd" type="button" aria-pressed="true">Lyd: på</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="384" height="208" aria-label="Kontoret til Fjordvik Regnskap AS sett ovenfra"></canvas>
    <div class="hint" id="hint" hidden></div>
    <div class="dialog" id="dialog" hidden>
      <canvas id="face" width="32" height="32"></canvas>
      <div class="dbody">
        <div class="dname" id="dname"></div>
        <div class="dtext" id="dtext"></div>
        <div class="dopts" id="dopts"></div>
      </div>
      <button class="btn dnext" id="dnext" type="button">Videre ▶</button>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>
  <div class="help">Gå med piltaster eller WASD, eller trykk dit du vil gå. Snakk og bruk ting med E eller mellomrom. Velg svar med talltastene.</div>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TS=16,COLS=24,ROWS=13,W=384,H=208;
const cv=$('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const b=bgc.getContext('2d');
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- sound ---------- */
let ac=null,muted=false;
function beep(f,d,type,v,when){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(when||0),o=ac.createOscillator(),n=ac.createGain();o.type=type||'square';o.frequency.value=f;n.gain.setValueAtTime(v||0.035,t);n.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.06));o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+(d||0.06)+0.02);}catch(e){}}
const sfx={blip:()=>beep(520,0.025,'square',0.012),pick:()=>{beep(660,0.06);beep(880,0.08,'square',0.035,0.06);},up:()=>{beep(523,0.07,'triangle',0.06);beep(784,0.12,'triangle',0.06,0.07);},down:()=>{beep(330,0.09,'sawtooth',0.03);beep(220,0.16,'sawtooth',0.03,0.09);},ring:()=>{for(let i=0;i<4;i++){beep(1320,0.05,'square',0.03,i*0.09);beep(1100,0.05,'square',0.03,i*0.09+0.045);}},open:()=>{beep(392,0.06,'triangle',0.05);beep(523,0.06,'triangle',0.05,0.06);beep(659,0.1,'triangle',0.05,0.12);}};
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent='Lyd: '+(muted?'av':'på');$('snd').setAttribute('aria-pressed',String(!muted));if(!muted)sfx.pick();});

/* ---------- map ---------- */
const solidG=[];
for(let y=0;y<ROWS;y++){solidG.push([]);for(let x=0;x<COLS;x++)solidG[y][x]=y<2||y>11||(x===7&&y!==7)||(x===16&&y!==5);}
[[2,5],[3,5],[4,5],[2,6],[3,6],[4,6],[0,2],[0,11],[9,4],[10,4],[13,4],[14,4],[13,3],[8,2],[9,2],[15,2],[8,10],[15,11],[12,8],[13,8],[19,4],[20,4],[21,4],[20,3],[22,2],[23,2],[17,11],[10,2],[14,2],[14,11],[23,11],[6,2],[11,4]].forEach(([x,y])=>solidG[y][x]=true);

  randi:{skin:'#f0c9a8',hair:'#c9c2b2',shirt:'#8c2f45',shirt2:'#6e2236',pants:'#22303f',shoe:'#151a22',bg:'#4a2a3a',glasses:true,bob:true},
  jonas:{skin:'#eec3a0',hair:'#c2622d',shirt:'#3f9d6b',shirt2:'#2f7d54',pants:'#3a4654',shoe:'#151a22',bg:'#234a3a',beard:true},
  selma:{skin:'#c98f66',hair:'#1c1a22',shirt:'#d9a23a',shirt2:'#f3ecd6',pants:'#5a4636',shoe:'#151a22',bg:'#5a4320',long:true,apron:true},
  tor:{skin:'#e3b08c',hair:'#6b5a48',shirt:'#e8742c',shirt2:'#f2d13b',pants:'#22303f',shoe:'#151a22',bg:'#3a4654',cap:'#f2d13b',stubble:true},
  ingen:{bg:'#234256'}
};
const NAMES={du:'Du',randi:'Randi Fjordvik, daglig leder',jonas:'Jonas, kollega',selma:'Selma Aune, gründer',tor:'Tor Bråten, Bråten Bygg AS (telefon)',ingen:''};
const npcs=[{id:'randi',x:20,y:3},{id:'jonas',x:13,y:3},{id:'selma',x:3,y:4,present:false}];

  randi:{cells:[[20,3],[19,4],[20,4],[21,4]],label:'Snakk med Randi'},
  jonas:{cells:[[13,3],[13,4],[14,4]],label:'Snakk med Jonas'},
  selma:{cells:[[3,4],[2,5],[3,5],[4,5],[2,6],[3,6],[4,6]],label:'Snakk med Selma',present:()=>npcs[2].present},
  desk:{cells:[[9,4],[10,4]],label:'Bruk pulten din'},
  coffee:{cells:[[15,2]],label:'Ta en kaffe'}
};
const isSolid=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||solidG[y][x]||(npcs[2].present&&x===3&&y===4);

/* ---------- background art ---------- */

  R(b,0,32,112,160,'#4a6783');for(let y=32;y<192;y+=2)for(let x=(y/2%2)*2;x<112;x+=4)R(b,x,y,1,1,'#547391');for(let i=0;i<140;i++)R(b,rnd()*111,32+rnd()*159,1,1,'#3f5a74');

  for(let y=2;y<12;y++)for(let x=17;x<24;x++){const px=x*16,py=y*16;R(b,px,py,16,16,['#8a6248','#90684d','#845d44'][Math.floor(rnd()*3)]);R(b,px,py+7,16,1,'#75513a');R(b,px,py+15,16,1,'#75513a');R(b,px+(y%2?3:11),py,1,8,'#75513a');R(b,px+(y%2?11:3),py+8,1,8,'#75513a');R(b,px+5,py+3,3,1,'#9a7256');}
  R(b,272,32,112,160,'rgba(60,30,20,.08)');
  // rug in the manager's office
  R(b,18*16,7*16,80,48,'#a8423f');R(b,18*16+2,7*16+2,76,44,'#d9b36c');R(b,18*16+4,7*16+4,72,40,'#a8423f');R(b,18*16+7,7*16+7,66,34,'#93383a');
  for(let i=0;i<4;i++){R(b,18*16+13+i*16,7*16+20,8,8,'#d9b36c');R(b,18*16+15+i*16,7*16+22,4,4,'#a8423f');}
  for(let i=0;i<80;i+=3){R(b,18*16+i,7*16-2,1,2,'#d9b36c');R(b,18*16+i,10*16,1,2,'#d9b36c');}
  // top wall
  R(b,0,0,W,32,'#e3e8e2');R(b,0,22,W,10,'#d2dad6');R(b,0,22,W,1,'#b9c5c2');R(b,0,0,W,5,'#2a3b4d');R(b,0,5,W,1,'#b9c5c2');R(b,0,29,W,3,'#8a9aa3');R(b,0,31,W,1,'#5e6f7a');
  R(b,0,32,W,3,'rgba(0,0,0,.2)');R(b,0,35,W,2,'rgba(0,0,0,.08)');
  // partitions
  [[7,7],[16,5]].forEach(([c,door])=>{for(let y=2;y<12;y++){if(y===door){R(b,c*16,y*16,16,16,'#8f7b62');R(b,c*16+4,y*16,8,16,'#7d6a52');continue;}R(b,c*16+12,y*16,3,16,'rgba(0,0,0,.14)');R(b,c*16+4,y*16,8,16,'#cfd8d6');R(b,c*16+4,y*16,2,16,'#eef3f1');R(b,c*16+11,y*16,1,16,'#8a9aa3');if(y%3===0)R(b,c*16+4,y*16+7,8,1,'#b9c5c2');}R(b,c*16+3,0,10,32,'#b9c5c2');R(b,c*16+3,0,10,5,'#2a3b4d');});
  // bottom wall and entrance
  R(b,0,189,W,3,'rgba(0,0,0,.14)');R(b,0,192,W,16,'#1c2835');R(b,0,192,W,2,'#3d5266');R(b,11*16,192,32,16,'#6b4a33');R(b,11*16+2,194,13,14,'#855f43');R(b,11*16+17,194,13,14,'#855f43');R(b,11*16+4,196,9,5,'#8fb4c9');R(b,11*16+19,196,9,5,'#8fb4c9');R(b,11*16+13,203,2,2,'#f2b84b');R(b,11*16+17,203,2,2,'#f2b84b');

  R(b,228,9,14,13,'#3a4654');R(b,230,11,10,9,'#8fc1e3');R(b,230,16,10,4,'#2e6f8f');R(b,232,13,5,4,'#f6f8f7');R(b,231,15,7,2,'#566676');
  R(b,326,9,14,13,'#c9a24a');R(b,328,11,10,9,'#f3ecd6');R(b,330,13,6,1,'#3a4654');R(b,330,15,6,1,'#3a4654');R(b,333,17,2,2,'#a8423f');
  // furniture
  shelf(8,2);shelf(9,2);shelf(22,2);shelf(23,2);cabinet(10,2);cooler(14,2);
  plant(0,2);plant(0,11);plant(15,11);plant(17,11);
  // sideboard in the meeting room
  R(b,96,44,16,3,'rgba(0,0,0,.2)');R(b,96,30,16,15,'#a8743f');R(b,96,30,16,3,'#d9a66b');R(b,97,35,6,8,'#8a5c30');R(b,105,35,6,8,'#8a5c30');R(b,99,23,4,7,'#bfeaf6');R(b,100,21,2,2,'#8fb4c9');R(b,105,26,2,4,'#e9f0ee');R(b,108,26,2,4,'#e9f0ee');
  // meeting table and chairs
  for(let i=0;i<3;i++){chair(2+i,4,false);chair(2+i,7,true);}
  R(b,30,5*16+28,52,3,'rgba(0,0,0,.25)');R(b,30,5*16+1,52,27,'#a8743f');R(b,30,5*16+1,52,23,'#d9a66b');R(b,30,5*16+1,52,1,'#eec48e');R(b,31,5*16+12,50,1,'#cf9b60');
  R(b,40,5*16+8,10,7,'#3a4654');R(b,41,5*16+9,8,5,'#8fb4c9');R(b,39,5*16+15,12,2,'#566676');R(b,58,5*16+9,5,5,'#f3ecd6');R(b,59,5*16+10,3,3,'#6b4a33');R(b,68,5*16+5,9,11,'#f3ecd6');R(b,69,5*16+7,7,1,'#9fb6c2');R(b,69,5*16+10,7,1,'#9fb6c2');R(b,69,5*16+13,5,1,'#9fb6c2');R(b,78,5*16+12,1,6,'#2e86ab');
  // desks

function faceThing(id){let best=null,bd=99;for(const [cx,cy] of things[id].cells){const d=Math.abs(cx-P.x)+Math.abs(cy-P.y);if(d<bd){bd=d;best=[cx,cy];}}if(!best)return;const dx=best[0]-P.x,dy=best[1]-P.y;P.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
function bfs(goalFn){const prev=new Map(),q=[[P.x,P.y]];prev.set(P.x+','+P.y,null);while(q.length){const [x,y]=q.shift();if(goalFn(x,y)){const path=[];let k=x+','+y;while(prev.get(k)){path.unshift(k.split(',').map(Number));k=prev.get(k);}return path;}for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=nx+','+ny;if(prev.has(k)||isSolid(nx,ny))continue;prev.set(k,x+','+y);q.push([nx,ny]);}}return null;}
function goTo(tx,ty){if(!canMove())return;let id=null;for(const k in things)if(present(k)&&things[k].cells.some(c=>c[0]===tx&&c[1]===ty))id=k;
  if(id){const path=bfs((x,y)=>things[id].cells.some(c=>Math.abs(c[0]-x)+Math.abs(c[1]-y)===1));if(path){P.path=path;P.goal=id;}}
  else if(!isSolid(tx,ty)){const path=bfs((x,y)=>x===tx&&y===ty);if(path){P.path=path;P.goal=null;}}}

  if(!P.moving){if(!canMove()){P.path=[];P.goal=null;return;}
    let d=null;if(held.length){P.path=[];P.goal=null;d=held[held.length-1];}
    else if(P.path.length){const [nx,ny]=P.path.shift();for(const k in DIRS)if(P.x+DIRS[k][0]===nx&&P.y+DIRS[k][1]===ny)d=k;}
    if(d){P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];if(!isSolid(nx,ny)){P.tx=nx;P.ty=ny;P.moving=true;P.prog=0;}else P.path=[];}

 {title:'Bilag 2 av 3',paper:'<div class="hd">VERKTØYHUSET AS</div><div class="sm">Faktura 20417 · Org.nr. 912 345 678 MVA</div><div class="sm">Kunde: Bråten Bygg AS</div><div class="ln"><span>Kapp- og gjærsag</span><span>6 250,00</span></div><div class="ln"><span>Mva 25 %</span><span>1 562,50</span></div><div class="ln tot"><span>Å betale</span><span>7 812,50</span></div>',note:'',

];
async function case2(){const from=LOG.length;
  for(let n=0;n<BILAG.length;n++){const B=BILAG[n];
    showPanel('<h2>Bråten Bygg AS · '+B.title+'</h2><div class="cols"><div class="left"><div class="paper">'+B.paper+'</div>'+(B.note?'<div class="note">'+esc(B.note)+'</div>':'')+'</div><div class="right"><p>'+esc(B.q)+'</p><p class="sub">Hva gjør du?</p><div class="dopts" id="bo"></div><div id="bfb"></div></div></div>');
    const i=await new Promise(res=>{optHandlers=[];B.o.forEach((t,k)=>{const bt=document.createElement('button');bt.type='button';bt.className='opt';bt.innerHTML='<span class="k">'+(k+1)+'</span>'+esc(t);const h=()=>{sfx.pick();optHandlers=null;res(k);};bt.addEventListener('click',h);optHandlers.push(h);$('bo').appendChild(bt);});});

    if(n<2){const good=i===B.ok;adj({kvalitet:good?8:-8});logItem({title:B.title+': '+(n===0?'restaurantkvittering':'kappsag'),choice:B.o[i],v:good?'good':'bad',why:B.why,lu:B.lu});
      $('bfb').innerHTML='<div class="fb '+(good?'good':'bad')+'"><div class="v">'+(good?'Riktig behandlet':'Ikke riktig')+'</div><p>'+esc(B.why)+'</p></div><div class="row"><button class="btn" id="bnext" type="button">Neste bilag</button></div>';
      await clicked('#bnext');}
    else{let v,why,choice=B.o[i],reason='';
      if(i===1){hidePanel();
        await say('tor','TV-en? Den står hjemme i stua. Men jeg ser jo på byggeprogrammer, he he. Bare før den på firmaet.');
        const t=['Greit, jeg fører den som kontorutstyr.','Jeg fører den som kontorutstyr, men uten fradrag for mva.','Det er en privat kostnad. Selskapet får ikke fradrag, og du må betale den tilbake eller ta den som lønn eller utbytte.'];
        const c=await choose('du','Hva svarer du Tor?',t);closeDialog();choice='Ringte Tor. '+t[c];reason=await askReason(2,'Begrunn behandlingen av TV-fakturaen',t[c]);F.tv=c;
        if(c===2){adj({integritet:10,kvalitet:8,tillit:-3});v='good';await say('tor','Hmf. Greit. Jeg overfører pengene i kveld.');}
        else if(c===0){adj({integritet:-15,kvalitet:-8,tillit:3});v='bad';await say('tor','Sånn skal det være!');}
        else{adj({integritet:-5,kvalitet:-5});v='bad';await say('tor','Jaja, bedre enn ingenting.');}
        closeDialog();}
      else if(i===0){F.tv=0;adj({integritet:-15,kvalitet:-8,tillit:3});v='bad';}
      else{F.tv=3;adj({kvalitet:2,tillit:-5});v='mid';}
      why=(v==='good'?'Du avklarte fakta før du bokførte, og du forklarte konsekvensen for kunden. ':v==='mid'?'Konklusjonen er trolig riktig, men du bokførte uten å avklare fakta med kunden. Leveringsadressen er et varsel, ikke et bevis. ':'En TV i eierens stue er en privat kostnad. Å føre den som kontorutstyr gir uriktig regnskap og uriktig skatte- og mva-grunnlag. Det gjelder også om du dropper mva-fradraget. ')+
        'Private kostnader gir verken skattefradrag eller mva-fradrag for selskapet. Når selskapet har betalt, må beløpet føres som en fordring på Tor som han gjør opp, eller behandles som lønn eller utbytte. En fordring som blir stående, kan bli regnet som lån til aksjonær, som skattlegges som utbytte (skatteloven § 10-11).';

async function case3(){const from=LOG.length;
  await say('tor','Hei, det er Tor. Jeg trenger en tjeneste. Banken vil se foreløpige tall for i fjor før de gir oss byggelånet. Svaret må inn på fredag.');
  await say('tor','Vi fakturerte Solvik-prosjektet i januar, 480 000 kroner. Kan du ikke bare datere fakturaen til 31. desember? Jobben var jo nesten ferdig.');
  const o=['Greit, jeg daterer den til 31. desember.','Nei. Det kan jeg ikke gjøre.','Jeg kan ikke endre datoen. Men hvor mye av arbeidet var faktisk utført før nyttår?','Jeg må snakke med Randi før jeg svarer.'];
  const a=await choose('du','Hva svarer du?',o);F.tor=a;let firstReason='';
  if(a===0){closeDialog();firstReason=await askReason(3,'Begrunn svaret til Tor',o[0]);adj({integritet:-30,kvalitet:-15,tillit:5});F.backdated=true;await say('tor','Topp! Jeg visste du var til å stole på.');}
  else{
    if(a===1){adj({integritet:10,tillit:-8});await say('tor','Seriøst? Det er jo bare en dato.');}
    else if(a===2){adj({integritet:12,kvalitet:10,tillit:-2});await say('tor','Ærlig talt? Vi startet rett før jul. Det meste ble gjort i januar.');await say('du','Da er inntekten opptjent i år, og fakturaen skal vise når arbeidet faktisk ble levert. Jeg kan hjelpe deg med noe annet til banken: riktige tall, ordrereserven og et likviditetsbudsjett.');await say('tor','Banken vil ha et pent resultat, ikke et budsjett.');}
    else{await say('tor','Gjør det. Men jeg ringer henne selv også.');}
    closeDialog();if(a!==3)firstReason=await askReason(3,'Begrunn svaret til Tor',o[a]);
    if(a!==3)await say('tor','Da ringer jeg Randi. Ha det.');
  }
  logItem({title:'Tor vil tilbakedatere en faktura',choice:o[a],reason:firstReason,v:a===0?'bad':a===2?'good':'mid',
    why:(a===0?'Du gikk med på å lage et regnskap som viser inntekt i feil år. ':a===1?'Du sa nei, og det er riktig. Du kunne i tillegg ha undersøkt fakta og vist Tor en lovlig vei til det han trenger. ':a===2?'Du sa nei til datoen, undersøkte hva som faktisk var utført og tilbød et lovlig alternativ. ':'Å spørre lederen er lov, men svaret på selve spørsmålet er klart, og ansvaret for oppdraget kan du ikke gi fra deg. ')+
    'Inntekt skal resultatføres når den er opptjent (regnskapsloven § 4-1), og salgsdokumentet skal vise når leveringen skjedde (bokføringsforskriften § 5-1-1). En faktura med uriktig dato for å gi banken et bedre bilde er regnskapsmanipulasjon. En regnskapsfører som medvirker, bryter god regnskapsføringsskikk og risikerer både autorisasjonen og erstatningsansvar overfor banken.',
    lu:'6090 · har kjennskap til etiske regnskapsfaglige problemstillinger, herunder grensen mot regnskapsmanipulasjon'});
  if(a!==0){closeDialog();setObj('Randi vil snakke med deg','randi');await waitFor('randi');tick(20);
    await say('randi','Tor ringte. Han sier han bytter byrå hvis vi ikke hjelper ham med banken. Han står for en femdel av omsetningen vår.');
    await say('randi','Kan vi ikke finne en pragmatisk løsning på den fakturaen?');
    const ro=['Ok. Jeg daterer den om.','Nei. Det er regnskapsmanipulasjon, og det er vår autorisasjon som står på spill. Jeg foreslår at vi tilbyr Tor riktige tall med ordrereserve og likviditetsbudsjett, og at jeg dokumenterer saken.','Da får du gjøre det selv.'];
    const rr=await choose('du','Hva svarer du Randi?',ro);closeDialog();F.randi=rr;const reason=await askReason(4,'Begrunn svaret til Randi',ro[rr]);
    if(rr===0){F.backdated=true;adj({integritet:-25,kvalitet:-12});await say('randi','Fint. Da er den saken ute av verden.');}
    else if(rr===1){adj({integritet:12,kvalitet:8,tillit:6});await say('randi','... Du har rett. Jeg skulle ikke ha spurt. Jeg ringer Tor selv og tilbyr ham pakken til banken.');}
    else{adj({integritet:-8,kvalitet:-5});await say('randi','Greit. Jeg tar det herfra.');}
    logItem({title:'Press fra daglig leder',choice:ro[rr],reason,v:rr===1?'good':rr===0?'bad':'mid',
      why:(rr===1?'Du sto fast, forklarte risikoen for byrået og kom med et alternativ som løser kundens egentlige behov. ':rr===0?'Du ga etter for press fra lederen. Ansvaret for det du fører, er fortsatt ditt. ':'Du unngikk å gjøre det selv, men du stoppet det ikke, og du vet ikke hva som blir gjort på et oppdrag du arbeider på. ')+
      'Kravene til god regnskapsføringsskikk gjelder uansett hvor viktig kunden er for byrået. Når du sier nei, bør du samtidig vise hva du kan gjøre: banken trenger grunnlag for en kredittvurdering, og det kan dere levere med riktige tall. Skriv ned hva som ble spurt om, hva du svarte og hvorfor.',
      lu:'6366 · kan identifisere og analysere etiske dilemmaer og foreta godt begrunnede valg'});
  }
  closeDialog();await feedback('Tilbakemelding: telefonen fra Tor',from);

/* ---------- report ---------- */
function epilogue(){if(F.backdated)return 'Slik kunne det gått: Tre måneder senere oppdager banken at fakturadatoen ikke stemmer med timelistene. Lånet blir sagt opp, og Fjordvik Regnskap må forklare seg for Finanstilsynet.';
  if(F.randi===1)return 'Slik kunne det gått: Tor fikk lånet på riktige tall, med ordrereserve og likviditetsbudsjett som vedlegg. Han er fortsatt kunde.';
  return 'Slik kunne det gått: Randi ordnet saken med Tor på egen hånd. Du vet ikke hva som ble gjort, og du arbeider fortsatt på oppdraget.';}
function reportText(){const L=[];L.push('BYRÅET – rapport fra arbeidsdagen');if(playerName)L.push('Navn/kandidat: '+playerName);L.push('Kundetillit '+M.tillit+' · Faglig kvalitet '+M.kvalitet+' · Integritet '+M.integritet+' (skala 0–100)');L.push('');
  LOG.forEach((o,i)=>{L.push((i+1)+'. '+o.title+' ['+VERD[o.v]+']');L.push('   Valg: '+o.choice);if(o.reason)L.push('   Begrunnelse: '+o.reason);L.push('   Læringsutbytte: '+o.lu);L.push('');});
  L.push(epilogue());L.push('');L.push('Prøveversjon. Det faglige innholdet er ikke kvalitetssikret.');return L.join('\n');}
function report(){const good=LOG.filter(o=>o.v==='good').length;sfx.open();
  showPanel('<h2>Arbeidsdagen er over</h2><p>'+good+' av '+LOG.length+' valg var gode. Kundetillit '+M.tillit+', faglig kvalitet '+M.kvalitet+', integritet '+M.integritet+'.</p><p>'+esc(epilogue())+'</p><h3>Valgene dine</h3>'+fbHtml(LOG)+
   '<h3>Rapport til innlevering</h3><p class="sub">Kopier teksten og lim den inn i innleveringen.</p><label for="rep">Rapport</label><textarea id="rep" readonly style="min-height:180px;max-width:100%"></textarea><div class="row"><button class="btn" id="copy" type="button">Kopier rapport</button><button class="btn sec" id="again" type="button">Spill på nytt</button><span class="count" id="copied"></span></div><p class="sub">Prøveversjon. Det faglige innholdet er ikke kvalitetssikret.</p>');
  $('rep').value=reportText();
  $('copy').addEventListener('click',()=>{const done=()=>{$('copied').textContent='Kopiert';};const fb=()=>{$('rep').focus();$('rep').select();$('copied').textContent='Teksten er markert. Kopier med Ctrl+C.';};try{navigator.clipboard.writeText($('rep').value).then(done,fb);}catch(e){fb();}});
  $('again').addEventListener('click',()=>location.reload());
}

else title();
