<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Byrået</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
/* Layout: one game frame. HUD strip on top, pixel world in the middle, dialogue laid over the lower part of the world (stacked under it on phones). */
:root{
  color-scheme:dark;
  --ink:#0f1c26; --panel:#1a2f3d; --panel2:#234256; --line:#3d6079;
  --text:#e9f0ee; --muted:#9fb6c2; --amber:#f2b84b; --good:#6fcf8e; --bad:#ee7a6a;
  --paper:#f3ecd6; --paper-ink:#2a2a33; --paper-line:#b9ad8a;
  --display:'Pixelify Sans','Trebuchet MS',Verdana,sans-serif;
  --body:'VT323','Lucida Console','Courier New',monospace;
}
html,body{height:100%}
html{overflow-x:hidden}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:22px;line-height:1.15;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
.wrap{margin:0 auto;display:flex;flex-direction:column;gap:0;max-width:100%}
.hud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--panel);padding:6px 12px}
.clock{font-family:var(--display);font-weight:700;font-size:22px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.obj{flex:1 1 150px;min-width:0;color:var(--text)}
.obj b{font-weight:400;color:var(--muted)}
.meters{display:flex;flex-wrap:wrap;gap:6px 14px}
.meter{display:flex;align-items:center;gap:6px;font-size:19px;color:var(--muted);white-space:nowrap}
.bar{width:60px;height:12px;background:var(--ink);border:2px solid var(--line)}
.bar i{display:block;height:100%;background:var(--good);transition:width .4s steps(8)}
.bar.low i{background:var(--bad)}
.meter.flash{color:var(--amber)}
.snd{font-family:var(--body);font-size:19px;background:var(--panel2);color:var(--text);border:2px solid var(--line);padding:2px 8px;cursor:pointer}
.stage{position:relative;background:#000;max-width:100%}
.stage canvas#cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.hint{position:absolute;left:8px;top:8px;background:var(--ink);border:2px solid var(--amber);color:var(--amber);padding:1px 8px;font-size:20px;pointer-events:none}
.dialog{position:absolute;left:2%;right:2%;bottom:3%;display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:3px solid var(--text);
  padding:10px 12px;max-height:72%;overflow:auto;box-shadow:4px 4px 0 rgba(0,0,0,.45);z-index:3}
.dialog canvas{width:96px;height:96px;flex:none;image-rendering:pixelated;border:2px solid var(--line)}
.stage.scene .dialog{left:43%;top:7%;bottom:auto;right:2%;max-height:86%}
.dbody{flex:1;min-width:0}
.dname{font-family:var(--display);font-weight:600;font-size:18px;color:var(--amber);margin-bottom:2px}
.dtext{min-height:2.3em;white-space:pre-wrap}
.dopts{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.dnext{align-self:flex-end;flex:none}
.btn,.opt{font-family:var(--body);font-size:21px;line-height:1.1;cursor:pointer;border:2px solid var(--ink);padding:6px 12px}
.btn{background:var(--amber);color:var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4)}
.btn.sec{background:var(--panel2);color:var(--text);border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.opt{background:var(--panel2);color:var(--text);border-color:var(--line);text-align:left}
.opt:hover,.opt:focus-visible{background:var(--line)}
.opt .k{color:var(--amber);margin-right:8px}
.opt.used{opacity:.45}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.panel{position:absolute;inset:0;overflow:auto;background:var(--ink);padding:18px clamp(14px,4%,42px);z-index:2}
.panel.veil{background:rgba(15,28,38,.80)}
.panel h1{font-family:var(--display);font-weight:700;font-size:clamp(36px,7vw,60px);line-height:1;margin:0;color:var(--amber);letter-spacing:.04em;text-shadow:4px 4px 0 #000}
.panel h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0 0 8px;color:var(--amber);text-wrap:balance}
.panel h3{font-family:var(--display);font-weight:600;font-size:19px;margin:14px 0 4px;color:var(--text)}
.panel p{margin:6px 0;max-width:68ch}
.panel .sub{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.cols>*{min-width:0}
.cols .left{flex:1 1 260px}.cols .right{flex:1.2 1 300px}
input[type=text],textarea{font-family:var(--body);font-size:21px;background:var(--ink);color:var(--text);border:2px solid var(--line);padding:6px 8px;width:100%;max-width:560px}
textarea{min-height:110px;resize:vertical}
label{display:block;color:var(--muted);margin:8px 0 3px}
.paper{background:var(--paper);color:var(--paper-ink);padding:14px 16px;border:2px solid var(--paper-line);box-shadow:5px 5px 0 rgba(0,0,0,.45);transform:rotate(-.6deg);max-width:340px}
.paper .hd{font-family:var(--display);font-weight:700;font-size:20px}
.paper .ln{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--paper-line);padding:2px 0;font-variant-numeric:tabular-nums}
.paper .tot{font-weight:700;border-bottom:3px double var(--paper-ink)}
.paper .sm{font-size:18px;opacity:.8}
.note{background:#f7d774;color:#3a2f10;padding:8px 10px;margin-top:10px;transform:rotate(1.4deg);max-width:230px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.fb{border-left:4px solid var(--line);padding:4px 0 4px 12px;margin:10px 0}
.fb.good{border-color:var(--good)}.fb.mid{border-color:var(--amber)}.fb.bad{border-color:var(--bad)}
.fb .v{font-family:var(--display);font-size:17px}
.fb.good .v{color:var(--good)}.fb.mid .v{color:var(--amber)}.fb.bad .v{color:var(--bad)}
.tag{display:inline-block;font-size:18px;color:var(--muted);border:1px solid var(--line);padding:0 6px;margin-top:4px}
.help{color:var(--muted);font-size:19px}
.count{color:var(--muted);font-size:18px}
.prof ul{margin:4px 0;padding:0;list-style:none}
.prof li{padding-left:1.3em;text-indent:-1.3em;max-width:68ch}
.prof li.ok::before{content:"\2713\00a0";color:var(--good)}
.prof li.no::before{content:"\2717\00a0";color:var(--bad)}
.wrap.narrow .dialog{position:static;max-height:none;margin:0;border-width:3px 0 0;box-shadow:none}
.wrap.narrow .stage.has-panel canvas#cv,.wrap.narrow .stage.has-panel .hint{display:none}
.wrap.narrow .panel{position:static}
.wrap.narrow .dialog canvas{width:64px;height:64px}
.panel canvas#banner{display:block;width:min(100%,480px);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--line);margin-bottom:12px}
.tcols{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center}
.tcols canvas#banner{flex:1 1 340px;width:auto;max-width:576px;min-width:0;margin:0}
.tbody{flex:1 1 280px;min-width:0}
.tbody h1{font-size:clamp(32px,5vw,48px)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<main class="wrap" id="wrap">
  <header class="hud">
    <div class="clock" id="clock">MAN 08:00</div>
    <div class="obj" id="obj"><b>Mål:</b> Start arbeidsdagen</div>
    <div class="meters">
      <div class="meter" id="m-tillit">Tillit <span class="bar"><i style="width:50%"></i></span></div>
      <div class="meter" id="m-kvalitet">Kvalitet <span class="bar"><i style="width:50%"></i></span></div>
      <div class="meter" id="m-integritet">Integritet <span class="bar"><i style="width:50%"></i></span></div>
    </div>
    <button class="snd" id="snd" type="button" aria-pressed="true">Lyd: på</button>
    <button class="snd" id="fs" type="button">Fullskjerm</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="384" height="208" aria-label="Kontoret til Fjordvik Regnskap AS sett ovenfra"></canvas>
    <div class="hint" id="hint" hidden></div>
    <div class="dialog" id="dialog" hidden>
      <canvas id="face" width="32" height="32"></canvas>
      <div class="dbody">
        <div class="dname" id="dname"></div>
        <div class="dtext" id="dtext"></div>
        <div class="dopts" id="dopts"></div>
      </div>
      <button class="btn dnext" id="dnext" type="button">Videre ▶</button>
    </div>
    <div class="panel" id="panel" hidden></div>
  </div>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TS=16,COLS=24,ROWS=13,W=384,H=208;
const cv=$('cv'),g=cv.getContext('2d');g.imageSmoothingEnabled=false;
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const b=bgc.getContext('2d');
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),w,h);};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

/* ---------- sound ---------- */
let ac=null,muted=false;
function beep(f,d,type,v,when){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+(when||0),o=ac.createOscillator(),n=ac.createGain();o.type=type||'square';o.frequency.value=f;n.gain.setValueAtTime(v||0.035,t);n.gain.exponentialRampToValueAtTime(0.0001,t+(d||0.06));o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+(d||0.06)+0.02);}catch(e){}}
const sfx={blip:()=>beep(520,0.025,'square',0.012),pick:()=>{beep(660,0.06);beep(880,0.08,'square',0.035,0.06);},up:()=>{beep(523,0.07,'triangle',0.06);beep(784,0.12,'triangle',0.06,0.07);},down:()=>{beep(330,0.09,'sawtooth',0.03);beep(220,0.16,'sawtooth',0.03,0.09);},ring:()=>{for(let i=0;i<4;i++){beep(1320,0.05,'square',0.03,i*0.09);beep(1100,0.05,'square',0.03,i*0.09+0.045);}},open:()=>{beep(392,0.06,'triangle',0.05);beep(523,0.06,'triangle',0.05,0.06);beep(659,0.1,'triangle',0.05,0.12);}};
$('snd').addEventListener('click',()=>{muted=!muted;$('snd').textContent='Lyd: '+(muted?'av':'på');$('snd').setAttribute('aria-pressed',String(!muted));if(!muted)sfx.pick();});

/* ---------- map ---------- */
const solidG=[];
for(let y=0;y<ROWS;y++){solidG.push([]);for(let x=0;x<COLS;x++)solidG[y][x]=y<2||y>11||(x===7&&y!==7)||(x===16&&y!==5);}
[[2,5],[3,5],[4,5],[2,6],[3,6],[4,6],[0,2],[0,11],[9,4],[10,4],[13,4],[14,4],[13,3],[8,2],[9,2],[15,2],[8,10],[15,11],[12,8],[13,8],[19,4],[20,4],[21,4],[20,3],[22,2],[23,2],[17,11],[10,2],[14,2],[14,11],[23,11],[6,2],[11,4]].forEach(([x,y])=>solidG[y][x]=true);

const PAL={
  du:{skin:'#e8b990',hair:'#5a3b26',shirt:'#2e86ab',shirt2:'#226a88',pants:'#2b3344',shoe:'#151a22',bg:'#234256'},
  randi:{skin:'#f0c9a8',hair:'#c9c2b2',shirt:'#8c2f45',shirt2:'#6e2236',pants:'#22303f',shoe:'#151a22',bg:'#4a2a3a',glasses:true,bob:true},
  jonas:{skin:'#eec3a0',hair:'#c2622d',shirt:'#3f9d6b',shirt2:'#2f7d54',pants:'#3a4654',shoe:'#151a22',bg:'#234a3a',beard:true},
  selma:{skin:'#c98f66',hair:'#1c1a22',shirt:'#d9a23a',shirt2:'#f3ecd6',pants:'#5a4636',shoe:'#151a22',bg:'#5a4320',long:true,apron:true},
  tor:{skin:'#e3b08c',hair:'#6b5a48',shirt:'#e8742c',shirt2:'#f2d13b',pants:'#22303f',shoe:'#151a22',bg:'#3a4654',cap:'#f2d13b',stubble:true},
  ingrid:{skin:'#f2cdb0',hair:'#d9b45c',shirt:'#7a5aa8',shirt2:'#5d4486',pants:'#2b3344',shoe:'#151a22',bg:'#3d2f5a',long:true},
  arvid:{skin:'#e0ae8a',hair:'#4a4a52',shirt:'#2b4a6b',shirt2:'#f2d13b',pants:'#22303f',shoe:'#151a22',bg:'#22384d',cap:'#2e5f9e',stubble:true},
  geir:{skin:'#e6b896',hair:'#2a2622',shirt:'#566676',shirt2:'#3a4654',pants:'#22303f',shoe:'#151a22',bg:'#3a4654',beard:true,glasses:true},
  ingen:{bg:'#234256'}
};
const NAMES={du:'Du',randi:'Randi Fjordvik, daglig leder',jonas:'Jonas, kollega',selma:'Selma Aune, gründer',tor:'Tor Bråten, Bråten Bygg AS (telefon)',ingrid:'Ingrid Holm, Holm Garn AS',arvid:'Arvid Nes, Nes Rør AS',geir:'Geir Vestby, Vestby Bil AS (telefon)',ingen:''};
const npcs=[{id:'randi',x:20,y:3},{id:'jonas',x:13,y:3},{id:'selma',x:3,y:4,present:false}];
const things={
  randi:{cells:[[20,3],[19,4],[20,4],[21,4]],label:'Snakk med Randi'},
  jonas:{cells:[[13,3],[13,4],[14,4]],label:'Snakk med Jonas'},
  kunde:{cells:[[3,4],[2,5],[3,5],[4,5],[2,6],[3,6],[4,6]],label:'Snakk med kunden',present:()=>npcs[2].present},
  desk:{cells:[[9,4],[10,4]],label:'Bruk pulten din'},
  coffee:{cells:[[15,2]],label:'Ta en kaffe'}
};
const isSolid=(x,y)=>x<0||y<0||x>=COLS||y>=ROWS||solidG[y][x]||(npcs[2].present&&x===3&&y===4);

/* ---------- background art ---------- */
let seed=11;const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
function tint(hex,a){const n=parseInt(hex.slice(1),16),c=v=>Math.max(0,Math.min(255,v+a));return 'rgb('+c(n>>16)+','+c(n>>8&255)+','+c(n&255)+')';}
function drawBg(){
  const wood=['#bd8f62','#c4976a','#b5875a','#c09265'];
  for(let y=32;y<192;y+=4){let x=108-Math.floor(rnd()*20);while(x<276){const len=18+Math.floor(rnd()*22);R(b,x,y,len,4,wood[Math.floor(rnd()*4)]);R(b,x,y+3,len,1,'#a67c52');R(b,x+len-1,y,1,3,'#9f7449');x+=len;}}
  R(b,0,32,112,160,'#4a6783');for(let y=32;y<192;y+=2)for(let x=(y/2%2)*2;x<112;x+=4)R(b,x,y,1,1,'#547391');for(let i=0;i<140;i++)R(b,rnd()*111,32+rnd()*159,1,1,'#3f5a74');
  R(b,20,58,74,78,'#33506b');R(b,22,60,70,74,'#6d8bab');R(b,24,62,66,70,'#3f5c78');
  for(let y=2;y<12;y++)for(let x=17;x<24;x++){const px=x*16,py=y*16;R(b,px,py,16,16,['#8a6248','#90684d','#845d44'][Math.floor(rnd()*3)]);R(b,px,py+7,16,1,'#75513a');R(b,px,py+15,16,1,'#75513a');R(b,px+(y%2?3:11),py,1,8,'#75513a');R(b,px+(y%2?11:3),py+8,1,8,'#75513a');R(b,px+5,py+3,3,1,'#9a7256');}
  R(b,272,32,112,160,'rgba(60,30,20,.08)');
  // rug in the manager's office
  R(b,18*16,7*16,80,48,'#a8423f');R(b,18*16+2,7*16+2,76,44,'#d9b36c');R(b,18*16+4,7*16+4,72,40,'#a8423f');R(b,18*16+7,7*16+7,66,34,'#93383a');
  for(let i=0;i<4;i++){R(b,18*16+13+i*16,7*16+20,8,8,'#d9b36c');R(b,18*16+15+i*16,7*16+22,4,4,'#a8423f');}
  for(let i=0;i<80;i+=3){R(b,18*16+i,7*16-2,1,2,'#d9b36c');R(b,18*16+i,10*16,1,2,'#d9b36c');}
  // top wall
  R(b,0,0,W,32,'#e3e8e2');R(b,0,22,W,10,'#d2dad6');R(b,0,22,W,1,'#b9c5c2');R(b,0,0,W,5,'#2a3b4d');R(b,0,5,W,1,'#b9c5c2');R(b,0,29,W,3,'#8a9aa3');R(b,0,31,W,1,'#5e6f7a');
  R(b,0,32,W,3,'rgba(0,0,0,.2)');R(b,0,35,W,2,'rgba(0,0,0,.08)');
  // partitions
  [[7,7],[16,5]].forEach(([c,door])=>{for(let y=2;y<12;y++){if(y===door){R(b,c*16,y*16,16,16,'#8f7b62');R(b,c*16+4,y*16,8,16,'#7d6a52');continue;}R(b,c*16+12,y*16,3,16,'rgba(0,0,0,.14)');R(b,c*16+4,y*16,8,16,'#cfd8d6');R(b,c*16+4,y*16,2,16,'#eef3f1');R(b,c*16+11,y*16,1,16,'#8a9aa3');if(y%3===0)R(b,c*16+4,y*16+7,8,1,'#b9c5c2');}R(b,c*16+3,0,10,32,'#b9c5c2');R(b,c*16+3,0,10,5,'#2a3b4d');});
  // bottom wall and entrance
  R(b,0,189,W,3,'rgba(0,0,0,.14)');R(b,0,192,W,16,'#1c2835');R(b,0,192,W,2,'#3d5266');R(b,11*16,192,32,16,'#6b4a33');R(b,11*16+2,194,13,14,'#855f43');R(b,11*16+17,194,13,14,'#855f43');R(b,11*16+4,196,9,5,'#8fb4c9');R(b,11*16+19,196,9,5,'#8fb4c9');R(b,11*16+13,203,2,2,'#f2b84b');R(b,11*16+17,203,2,2,'#f2b84b');
  R(b,11*16+2,183,28,8,'#3a4654');R(b,11*16+4,185,24,4,'#4d5d6d');for(let i=0;i<24;i+=3)R(b,11*16+4+i,185,1,4,'#3a4654');
  // whiteboard
  R(b,36,8,42,19,'#8a9aa3');R(b,37,9,40,17,'#f6f8f7');R(b,37,26,40,1,'#566676');R(b,60,26,6,2,'#a8322c');R(b,68,26,6,2,'#2e86ab');
  [[40,21,4,4,'#2e86ab'],[46,18,4,7,'#2e86ab'],[52,15,4,10,'#2e86ab'],[58,19,4,6,'#ee7a6a']].forEach(a=>R(b,...a));
  for(let i=0;i<9;i++)R(b,65+i,22-i,1,1,'#3f9d6b');R(b,40,12,12,1,'#3a4654');
  // wall things: calendar, picture, certificates
  R(b,174,10,9,11,'#f6f8f7');R(b,174,10,9,3,'#a8322c');for(let i=0;i<3;i++)for(let j=0;j<2;j++)R(b,176+i*2,15+j*3,1,1,'#566676');
  R(b,228,9,14,13,'#3a4654');R(b,230,11,10,9,'#8fc1e3');R(b,230,16,10,4,'#2e6f8f');R(b,232,13,5,4,'#f6f8f7');R(b,231,15,7,2,'#566676');
  R(b,326,9,14,13,'#c9a24a');R(b,328,11,10,9,'#f3ecd6');R(b,330,13,6,1,'#3a4654');R(b,330,15,6,1,'#3a4654');R(b,333,17,2,2,'#a8423f');
  // furniture
  shelf(8,2);shelf(9,2);shelf(22,2);shelf(23,2);cabinet(10,2);cooler(14,2);
  plant(0,2);plant(0,11);plant(15,11);plant(17,11);
  // sideboard in the meeting room
  R(b,96,44,16,3,'rgba(0,0,0,.2)');R(b,96,30,16,15,'#a8743f');R(b,96,30,16,3,'#d9a66b');R(b,97,35,6,8,'#8a5c30');R(b,105,35,6,8,'#8a5c30');R(b,99,23,4,7,'#bfeaf6');R(b,100,21,2,2,'#8fb4c9');R(b,105,26,2,4,'#e9f0ee');R(b,108,26,2,4,'#e9f0ee');

function faceThing(id){let best=null,bd=99;for(const [cx,cy] of things[id].cells){const d=Math.abs(cx-P.x)+Math.abs(cy-P.y);if(d<bd){bd=d;best=[cx,cy];}}if(!best)return;const dx=best[0]-P.x,dy=best[1]-P.y;P.dir=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');}
function bfs(goalFn){const prev=new Map(),q=[[P.x,P.y]];prev.set(P.x+','+P.y,null);while(q.length){const [x,y]=q.shift();if(goalFn(x,y)){const path=[];let k=x+','+y;while(prev.get(k)){path.unshift(k.split(',').map(Number));k=prev.get(k);}return path;}for(const d in DIRS){const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=nx+','+ny;if(prev.has(k)||isSolid(nx,ny))continue;prev.set(k,x+','+y);q.push([nx,ny]);}}return null;}
function goTo(tx,ty){if(!canMove())return;let id=null;for(const k in things)if(present(k)&&things[k].cells.some(c=>c[0]===tx&&c[1]===ty))id=k;
  if(id){const path=bfs((x,y)=>things[id].cells.some(c=>Math.abs(c[0]-x)+Math.abs(c[1]-y)===1));if(path){P.path=path;P.goal=id;}}
  else if(!isSolid(tx,ty)){const path=bfs((x,y)=>x===tx&&y===ty);if(path){P.path=path;P.goal=null;}}}
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect();goTo(Math.floor((e.clientX-r.left)/r.width*COLS),Math.floor((e.clientY-r.top)/r.height*ROWS));});
function interact(id){if(!canMove())return;faceThing(id);if(waiting&&waiting.id===id){const w=waiting;waiting=null;w.res();return;}if(ambient[id]){ambientBusy=true;ambient[id]().then(()=>{closeDialog();ambientBusy=false;});}}
function update(dt){anim+=dt*4;
  if(P.moving){P.prog+=dt*7.5;if(P.prog>=1){P.x=P.tx;P.y=P.ty;P.moving=false;P.prog=0;P.step++;}}
  if(!P.moving){if(!canMove()){P.path=[];P.goal=null;return;}
    let d=null;if(held.length){P.path=[];P.goal=null;d=held[held.length-1];}
    else if(P.path.length){const [nx,ny]=P.path.shift();for(const k in DIRS)if(P.x+DIRS[k][0]===nx&&P.y+DIRS[k][1]===ny)d=k;}
    if(d){P.dir=d;const nx=P.x+DIRS[d][0],ny=P.y+DIRS[d][1];if(!isSolid(nx,ny)){P.tx=nx;P.ty=ny;P.moving=true;P.prog=0;}else P.path=[];}
    else if(P.goal){const id=P.goal;P.goal=null;interact(id);}}
}

/* ----- bank 2: bilag ----- */
async function runBooks(C){const from=LOG.length,N=C.bilag.length;
  for(let n=0;n<N;n++){const B=C.bilag[n],ttl='Bilag '+(n+1)+' av '+N;
    const i=await panelChoice(C.client+' · '+ttl,'<div class="paper">'+B.paper+'</div>'+(B.note?'<div class="note">'+esc(B.note)+'</div>':''),B.q,B.o);tick(25);
    if(B.special){await B.special(i,B,ttl);continue;}
    const good=i===B.ok,mid=!good&&!!B.mid&&B.mid.includes(i),v=good?'good':mid?'mid':'bad';
    adj({kvalitet:good?8:mid?-2:-8});
    (B.marks||[]).forEach(m=>mark(m[0],m[3]?m[3](i):good,m[1],m[2]));
    logItem({title:ttl+': '+B.name,choice:B.o[i],v,why:B.why,lu:B.lu});
    $('bfb').innerHTML='<div class="fb '+v+'"><div class="v">'+(good?'Riktig behandlet':mid?'Delvis riktig':'Ikke riktig')+'</div><p>'+esc(B.why)+'</p></div><div class="row"><button class="btn" id="bnext" type="button">'+(n<N-1?'Neste bilag':'Ferdig med bilagene')+'</button></div>';
    await clicked('#bnext');}
  hidePanel();await feedback('Tilbakemelding: bilagene fra '+C.client,from);}
async function tvSpecial(i,B,ttl){let v,choice=B.o[i],reason='';
  mark('fakta',i===1,'Du ringte Tor før du bokførte TV-fakturaen.','Du bokførte TV-fakturaen uten å spørre Tor først.');
  if(i===1){hidePanel();
    await say('tor','TV-en? Den står hjemme i stua. Men jeg ser jo på byggeprogrammer, he he. Bare før den på firmaet.');
    const t=['Greit, jeg fører den som kontorutstyr.','Jeg fører den som kontorutstyr, men uten fradrag for mva.','Det er en privat kostnad. Selskapet får ikke fradrag, og du må betale den tilbake eller ta den som lønn eller utbytte.'];
    const c=await choose('du','Hva svarer du Tor?',t);closeDialog();choice='Ringte Tor. '+t[c];reason=await askReason(2,'Begrunn behandlingen av TV-fakturaen',t[c]);F.tv=c;
    if(c===2){adj({integritet:10,kvalitet:8,tillit:-3});v='good';await say('tor','Hmf. Greit. Jeg overfører pengene i kveld.');}
    else if(c===0){adj({integritet:-15,kvalitet:-8,tillit:3});v='bad';await say('tor','Sånn skal det være!');}
    else{adj({integritet:-5,kvalitet:-5});v='bad';await say('tor','Jaja, bedre enn ingenting.');}
    closeDialog();}
  else if(i===0){F.tv=0;adj({integritet:-15,kvalitet:-8,tillit:3});v='bad';}
  else{F.tv=3;adj({kvalitet:2,tillit:-5});v='mid';}
  mark('press',F.tv===2||F.tv===3,'Du førte ikke TV-en som kontorutstyr, selv om Tor ba om det.','Du førte TV-en som kontorutstyr fordi Tor ba om det.');
  mark('alt',i===1&&F.tv===2,'Du forklarte Tor hvordan TV-kjøpet kan gjøres opp: tilbakebetaling, lønn eller utbytte.','Du forklarte ikke Tor hvordan TV-kjøpet kan gjøres opp på lovlig vis.');
  const why=(v==='good'?'Du avklarte fakta før du bokførte, og du forklarte konsekvensen for kunden. ':v==='mid'?'Konklusjonen er trolig riktig, men du bokførte uten å avklare fakta med kunden. Leveringsadressen er et varsel, ikke et bevis. ':'En TV i eierens stue er en privat kostnad. Å føre den som kontorutstyr gir uriktig regnskap og uriktig skatte- og mva-grunnlag. Det gjelder også om du dropper mva-fradraget. ')+
    'Private kostnader gir verken skattefradrag eller mva-fradrag for selskapet. Når selskapet har betalt, må beløpet føres som en fordring på Tor som han gjør opp, eller behandles som lønn eller utbytte. En fordring som blir stående, kan bli regnet som lån til aksjonær, som skattlegges som utbytte (skatteloven § 10-11).';
  logItem({title:ttl+': TV levert privat',choice,reason,v,why,lu:LU.lojal});}

   {name:'faktura fra selger uten mva-registrering',paper:'<div class="hd">SOLBAKKEN GÅRD</div><div class="sm">Faktura 17 · Org.nr. 934 567 890</div><div class="sm">Kunde: Kafé Kvern AS</div><div class="ln"><span>Egg, 60 brett</span><span>3 000,00</span></div><div class="ln"><span>Mva 15 %</span><span>450,00</span></div><div class="ln tot"><span>Å betale</span><span>3 450,00</span></div>',note:'',

 {title:'Tor Bråten vil tilbakedatere en faktura',
  jonas:'Tor står for en femdel av omsetningen vår. Randi liker ikke at vi krangler med ham. Det betyr ikke at han har rett.',
  async run(){const from=LOG.length;

      else{await say('tor','Gjør det. Men jeg ringer henne selv også.');}

    mark('fakta',a===2,'Du undersøkte hvor mye av Solvik-prosjektet som var utført før nyttår.','Du undersøkte ikke hvor mye av Solvik-prosjektet som var utført før nyttår.');

      'Inntekt skal resultatføres når den er opptjent (regnskapsloven § 4-1), og salgsdokumentet skal vise når leveringen skjedde (bokføringsforskriften § 5-1-1). En faktura med uriktig dato for å gi banken et bedre bilde er regnskapsmanipulasjon. En regnskapsfører som medvirker, bryter god regnskapsføringsskikk og risikerer både autorisasjonen og erstatningsansvar overfor banken.',
      lu:LU.manip});
    if(a!==0){closeDialog();setObj('Randi vil snakke med deg','randi');await waitFor('randi');tick(20);
      await say('randi','Tor ringte. Han sier han bytter byrå hvis vi ikke hjelper ham med banken. Han står for en femdel av omsetningen vår.');
      await say('randi','Kan vi ikke finne en pragmatisk løsning på den fakturaen?');
      const ro=['Ok. Jeg daterer den om.','Nei. Det er regnskapsmanipulasjon, og det er vår autorisasjon som står på spill. Jeg foreslår at vi tilbyr Tor riktige tall med ordrereserve og likviditetsbudsjett, og at jeg dokumenterer saken.','Da får du gjøre det selv.'];

      else if(rr===1){adj({integritet:12,kvalitet:8,tillit:6});await say('randi','... Du har rett. Jeg skulle ikke ha spurt. Jeg ringer Tor selv og tilbyr ham pakken til banken.');}

      mark('press',rr===1,'Du sto fast da Randi la press på deg.',rr===0?'Du ga etter da Randi la press på deg.':'Du overlot avgjørelsen til Randi i stedet for å stoppe tilbakedateringen.');
      logItem({title:'Press fra daglig leder',choice:ro[rr],reason,v:rr===1?'good':rr===0?'bad':'mid',

  finish(){if(F.backdated)adj({tillit:-30});else if(F.randi===1)adj({tillit:10});},

 {title:'Kontantinnskudd uten dokumentasjon hos Vestby Bil AS',

    return 'Slik kunne det gått: Innskuddene ble stående uavklart. Ingen undersøkte dem videre, og ingen vet hvor pengene kom fra.';},
  trust(){if(F.hv==='bokfort')return 'Kundetilliten steg da Geir fikk viljen sin, og falt da politiet tok saken. Et ja gjør kunden fornøyd samme dag. Tilliten over tid følger av hvordan det går.';
    if(F.hv==='meldt')return 'Kundetilliten falt da du stilte spørsmål til Geir. Andre kunder, banker og myndigheter stoler på byrået fordi det følger hvitvaskingsreglene også når kunden er en gammel kjenning.';return '';}},

 {title:'Mva-melding med uforklart differanse hos Lund Elektro AS',
  jonas:'Jeg rakk ikke å avstemme Lund Elektro før jeg ble satt på et annet oppdrag. Det plager meg. En mva-melding uten avstemming er en gjetning.',
  async run(){const from=LOG.length;
    setObj('Randi vil snakke med deg','randi');await waitFor('randi');
    await say('randi','Mva-meldingen for Lund Elektro AS har frist i dag. Jonas har ført terminen, men han rakk ikke å avstemme før jeg satte ham på et annet oppdrag.','urolig');
    await say('randi','Kan du sende den inn før du går?','n');
    closeDialog();setObj('Gå til pulten din og se på mva-meldingen for Lund Elektro AS','desk');await waitFor('desk');
    const o=['Send meldingen som den er. Fristen er viktigst.','Finn årsaken til differansen før du sender. Det tar omtrent en time.','Vent med innsendingen til i morgen, så Jonas kan avstemme selv.','Send meldingen nå, og avstem i morgen. Send endringsmelding hvis noe er feil.'];
    const i=await panelChoice('Lund Elektro AS · Mva-melding','<div class="paper"><div class="hd">MVA-MELDING · UTKAST</div><div class="sm">Lund Elektro AS · siste termin</div><div class="ln"><span>Utgående mva</span><span>412 000,00</span></div><div class="ln"><span>Inngående mva</span><span>268 400,00</span></div><div class="ln tot"><span>Å betale</span><span>143 600,00</span></div><div class="sm">Kontroll mot leverandørreskontro:</div><div class="ln"><span>Inngående mva ifølge fakturaene</span><span>230 000,00</span></div><div class="ln tot"><span>Uforklart differanse</span><span>38 400,00</span></div></div>',
      'Utkastet er klart til innsending. Inngående mva i meldingen er 38 400 kroner høyere enn summen av leverandørfakturaene, og ingen har funnet ut hvorfor. Fristen er ved midnatt.',o);
    hidePanel();const reason=await askReason(3,'Begrunn hva du gjør med mva-meldingen',o[i]);let rr=-1;
    if(i===0){adj({integritet:-15,kvalitet:-15,tillit:3});F.mva='feil';}
    else if(i===2){adj({kvalitet:-10,tillit:-8});F.mva='sen';}
    else if(i===3){adj({integritet:-6,kvalitet:-6});F.mva='rettet';}
    else{adj({integritet:8,kvalitet:10});tick(20);
      await say('randi','Hvorfor er ikke Lund Elektro sendt? Eieren har ringt to ganger. Send den nå, så retter vi etterpå hvis det er noe.','sur');
      const ro=['Ok. Jeg sender den nå.','Det er en uforklart differanse på 38 400 kroner. Jeg sender ikke en melding jeg vet kan være feil. Jeg rekker å finne feilen før fristen.','Da må du sende den selv.'];
      rr=await choose('du','Hva svarer du Randi?',ro);closeDialog();const r2=await askReason(4,'Begrunn svaret til Randi',ro[rr]);
      if(rr===0){F.mva='feil';adj({integritet:-18,kvalitet:-14});await say('randi','Fint. Da er den ute av verden.','n');}
      else if(rr===1){F.mva='ok';adj({integritet:12,kvalitet:8,tillit:4});await say('randi','Greit. Men da må den være inne i dag.','n');tick(60);
        await say('ingen','Du går gjennom leverandørfakturaene. En faktura fra Elgross på 153 600 kroner pluss 38 400 kroner i mva er ført to ganger.');
        await say('ingen','Du retter feilen og sender meldingen. Riktig beløp å betale er 182 000 kroner.');}
      else{F.mva='feil';adj({integritet:-8,kvalitet:-6});await say('randi','Greit. Jeg sender den.','sur');}
      closeDialog();
      mark('press',rr===1,'Du sto fast da Randi ba deg sende meldingen uten avstemming.',rr===0?'Du ga etter da Randi ba deg sende meldingen uten avstemming.':'Du overlot innsendingen til Randi i stedet for å stoppe den.');
      mark('alt',rr===1,'Du viste Randi at det var tid til både avstemming og innsending innen fristen.','Du viste ikke Randi at avstemmingen kunne gjøres innen fristen.');
      logItem({title:'Press fra daglig leder',choice:ro[rr],reason:r2,v:rr===1?'good':rr===0?'bad':'mid',
        why:(rr===1?'Du sa hva som var usikkert, og hva du trengte for å løse det. ':rr===0?'Du ga etter for press fra lederen. Ansvaret for det du sender inn, er fortsatt ditt. ':'Du unngikk å sende meldingen selv, men den ble sendt med feil. ')+
        'Når lederen ber deg sende noe du ikke har kontrollert, bør du si hva som er usikkert, hva det kan koste kunden, og hvor lang tid du trenger. Da får lederen et reelt valg. Her var det tid til både avstemming og innsending.',
        lu:LU.etikk});}
    if(i===0)mark('press',false,'','Du sendte meldingen uten kontroll fordi fristen presset på.');
    mark('fakta',F.mva==='ok','Du fant årsaken til differansen før mva-meldingen ble sendt.','Differansen på 38 400 kroner ble ikke undersøkt før mva-meldingen ble sendt eller fristen gikk ut.');
    mark('dok',F.mva==='ok','Meldingen ble sendt med riktig beløp og innen fristen.',F.mva==='sen'?'Meldingen ble ikke sendt innen fristen.':F.mva==='rettet'?'Meldingen ble sendt med for høyt fradrag og måtte rettes med endringsmelding dagen etter.':'Meldingen ble sendt med for høyt fradrag for inngående mva.');
    LOG.splice(rr>=0?LOG.length-1:LOG.length,0,{title:'Mva-melding med uforklart differanse',choice:o[i],reason,v:i===1?'good':i===3?'mid':'bad',
      why:(i===1?'Du valgte å finne feilen før du sendte. ':i===0?'Du sendte en melding du hadde grunn til å tro var feil. ':i===2?'Du unngikk å sende noe uriktig, men fristen ble ikke holdt, og det var tid til å avstemme samme dag. ':'Endringsmelding er riktig verktøy når en feil oppdages etterpå. Det er ikke en plan for å sende noe du ikke har kontrollert. ')+
      'Den som leverer mva-melding, skal gi riktige og fullstendige opplysninger (skatteforvaltningsloven § 8-1). En uforklart differanse mot reskontro betyr at du ikke vet om meldingen er riktig. Her var en leverandørfaktura ført to ganger, slik at fradraget ble 38 400 kroner for høyt. Uriktige opplysninger kan gi tilleggsskatt (§ 14-3), og for sen levering kan gi tvangsmulkt (§ 14-1). Avstemming før innsending er en del av god regnskapsføringsskikk.',
      lu:LU.lojal});
    await feedback('Tilbakemelding: mva-meldingen for Lund Elektro',from);},
  finish(){if(F.mva==='feil')adj({tillit:-20});else if(F.mva==='sen')adj({tillit:-8});else if(F.mva==='ok')adj({tillit:8});},
  epi(){if(F.mva==='ok')return 'Slik kunne det gått: Lund Elektro betalte riktig avgift, 182 000 kroner. Feilen med fakturaen som var ført to ganger, ble rettet før noen utenfor byrået så den.';
    if(F.mva==='sen')return 'Slik kunne det gått: Meldingen kom inn for sent, og Lund Elektro fikk tvangsmulkt. Feilen ble funnet dagen etter.';
    if(F.mva==='rettet')return 'Slik kunne det gått: Dagen etter fant du fakturaen som var ført to ganger, og sendte endringsmelding. Lund Elektro betalte riktig avgift, men den første meldingen var feil da den ble sendt.';
    return 'Slik kunne det gått: Åtte måneder senere har Skatteetaten kontroll hos Lund Elektro. Fradraget var 38 400 kroner for høyt. Selskapet må betale beløpet med renter og får tilleggsskatt, og eieren spør hvorfor byrået ikke oppdaget feilen.';},
  trust(){if(F.mva==='ok')return 'Kundetilliten steg fordi meldingen ble riktig. Kunden merket ikke at den ble sendt senere på dagen enn Randi ønsket.';
    if(F.mva==='feil')return 'Kunden merket ingenting den dagen meldingen ble sendt. Tilliten falt da kontrollen kom.';return '';}}
];

function pickDay(){const B=[ADVICE,BOOKS,ETHICS],hm=location.hash.match(/^#dag-(\d)(\d)(\d)$/);let ix=null,fixed=false;
  if(hm){ix=[+hm[1]-1,+hm[2]-1,+hm[3]-1];if(ix.some((v,i)=>v<0||v>=B[i].length))ix=null;else fixed=true;}
  if(!ix){let prev=[];try{prev=JSON.parse(localStorage.getItem('byraaet-sist')||'[]')||[];}catch(e){prev=[];}
    ix=B.map((b,i)=>{let v=Math.floor(Math.random()*b.length);if(b.length>1&&v===prev[i])v=(v+1+Math.floor(Math.random()*(b.length-1)))%b.length;return v;});}
  try{localStorage.setItem('byraaet-sist',JSON.stringify(ix));}catch(e){}
  return {ix,fixed,code:ix.map(v=>v+1).join(''),a:ADVICE[ix[0]],b:BOOKS[ix[1]],e:ETHICS[ix[2]]};}
async function day(){DAY=pickDay();const A=DAY.a,B=DAY.b,E=DAY.e;npcs[2].id=A.who;things.kunde.label='Snakk med '+A.short;
  await say('ingen','Mandag morgen, klokka 08:00. Det er første uka di som regnskapsfører hos Fjordvik Regnskap AS.');
  closeDialog();setObj('Snakk med Randi på kontoret til høyre','randi');
  await waitFor('randi');
  await say('randi','God morgen! Fint at du er her. Du får tre ting i dag.');
  await say('randi',A.brief);await say('randi',B.brief);
  await say('randi','Og husk: du fører ikke bare tall. Kundene kommer til oss fordi de vil ha råd.');
  closeDialog();stage=1;npcs[2].present=true;setClock(540);sfx.open();setObj('Møt '+A.name+' på møterommet til venstre','kunde');
  await waitFor('kunde');await runAdvice(A);
  stage=2;npcs[2].present=false;setClock(Math.max(clock,630));setObj('Gå til pulten din og før bilagene fra '+B.client,'desk');
  await waitFor('desk');await runBooks(B);
  stage=3;setClock(Math.max(clock,840));await E.run();
  stage=4;setClock(960);setObj('Arbeidsdagen er over',null);E.finish();report();
}

/* ---------- report ---------- */
const SKILLS=[['fakta','Undersøker fakta før du konkluderer','å kartlegge fakta før du gir råd eller bokfører (6093 Regnskapsføreren som rådgiver, og 6091)'],
  ['dok','Krever dokumentasjon og følger formkravene','dokumentasjonskravene i bokføringsforskriften, kundetiltak og rapporteringsplikter (6091 Regnskapsføreryrket og regnskapsorganisering, og 6018)'],
  ['press','Står imot press','god regnskapsføringsskikk og etiske dilemmaer (6091, 6090 Årsregnskap og god regnskapsskikk, og 6366)'],
  ['alt','Viser kunden et lovlig alternativ','rådgivning og formidling av analyse til klienter (6091 og 6093)']];
function epilogue(){return DAY.e.epi();}
function trustNote(){return DAY.e.trust();}
function dayLine(){return 'Dagens saker: '+DAY.a.title+'. '+DAY.b.title+'. '+DAY.e.title+'.';}
function profile(){return SKILLS.filter(s=>PROF[s[0]].length).map(s=>{const items=PROF[s[0]],n=items.filter(i=>i.ok).length,all=n===items.length;
  return {name:s[1],rep:s[2],items,level:all?'good':n===0?'bad':'mid',label:all?'Dette viste du i dag':n===0?'Dette bør du øve på':'Delvis'};});}
function reportText(refl){const L=[];L.push('BYRÅET – rapport fra arbeidsdagen');if(playerName)L.push('Navn/kandidat: '+playerName);L.push(dayLine()+' (dag '+DAY.code+')');L.push('');L.push(epilogue());L.push('');
  L.push('HVA DU VISTE I DAG');profile().forEach(k=>{L.push(k.name+' ['+k.label+']');k.items.forEach(i=>L.push('   '+(i.ok?'+ ':'- ')+i.t));if(k.level!=='good')L.push('   Repeter: '+k.rep);L.push('');});
  L.push('REFLEKSJON: Hvilket valg ville du gjort annerledes, og hvorfor?');L.push(refl?refl:'(ikke besvart)');L.push('');
  L.push('VALGENE');LOG.forEach((o,i)=>{L.push((i+1)+'. '+o.title+' ['+VERD[o.v]+']');L.push('   Valg: '+o.choice);if(o.reason)L.push('   Begrunnelse: '+o.reason);L.push('   Læringsutbytte: '+o.lu);L.push('');});
  L.push('Målerne ved dagens slutt: kundetillit '+M.tillit+', faglig kvalitet '+M.kvalitet+', integritet '+M.integritet+' (skala 0–100).');L.push('Prøveversjon. Det faglige innholdet er ikke kvalitetssikret.');return L.join('\n');}
function report(){sfx.open();const tn=trustNote();
  const prof=profile().map(k=>'<div class="fb prof '+k.level+'"><div class="v">'+esc(k.label)+' · '+esc(k.name)+'</div><ul>'+k.items.map(i=>'<li class="'+(i.ok?'ok':'no')+'">'+esc(i.t)+'</li>').join('')+'</ul>'+(k.level!=='good'?'<p><span class="sub">Repeter:</span> '+esc(k.rep)+'</p>':'')+'</div>').join('');
  showPanel('<h2>Arbeidsdagen er over</h2><p>'+esc(epilogue())+'</p>'+(tn?'<p>'+esc(tn)+'</p>':'')+'<h3>Hva du viste i dag</h3>'+prof+
   '<h3>Refleksjon</h3><label for="refl">Hvilket valg ville du gjort annerledes, og hvorfor? Svaret kommer med i rapporten.</label><textarea id="refl" maxlength="1200"></textarea>'+
   '<h3>Rapport til innlevering</h3><p class="sub">Kopier teksten og lim den inn i innleveringen.</p><label for="rep">Rapport</label><textarea id="rep" readonly style="min-height:180px;max-width:100%"></textarea><div class="row"><button class="btn" id="copy" type="button">Kopier rapport</button><button class="btn sec" id="again" type="button">Spill en ny dag</button><button class="btn sec" id="same" type="button">Spill samme dag igjen</button><span class="count" id="copied"></span></div>'+
   '<p class="sub">'+esc(dayLine())+' Sakene trekkes tilfeldig hver gang. Skal flere spille akkurat denne dagen, legg til #dag-'+DAY.code+' bak adressen til spillet.</p>'+
   '<h3>Alle valgene dine</h3>'+fbHtml(LOG)+
   '<p class="sub">Målerne ved dagens slutt: kundetillit '+M.tillit+', faglig kvalitet '+M.kvalitet+', integritet '+M.integritet+'. Tallene bygger på '+LOG.length+' valg og sier ikke hvor godt du kan faget.</p><p class="sub">Prøveversjon. Det faglige innholdet er ikke kvalitetssikret.</p>');
  $('rep').value=reportText('');
  $('refl').addEventListener('input',()=>{$('rep').value=reportText($('refl').value.trim());$('copied').textContent='';});
  $('copy').addEventListener('click',()=>{const done=()=>{$('copied').textContent='Kopiert';};const fb=()=>{$('rep').focus();$('rep').select();$('copied').textContent='Teksten er markert. Kopier med Ctrl+C.';};try{navigator.clipboard.writeText($('rep').value).then(done,fb);}catch(e){fb();}});
  $('again').addEventListener('click',()=>{try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}location.reload();});
  $('same').addEventListener('click',()=>{location.hash='dag-'+DAY.code;location.reload();});
}

/* ---------- title and boot ---------- */
function fit(){const wrap=$('wrap'),st=$('stage'),cs=getComputedStyle(document.body);
  const availW=document.documentElement.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  let w=Math.max(Math.min(availW,460),Math.floor(Math.min(availW,(document.documentElement.clientHeight-110)*W/H)));
  for(let pass=0;pass<3;pass++){wrap.style.width=w+'px';wrap.classList.toggle('narrow',w<700);
    const over=wrap.offsetHeight-st.offsetHeight+parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom)+2;
    let n=Math.floor(Math.min(availW,(document.documentElement.clientHeight-over)*W/H));n=Math.max(n,Math.min(availW,460));
    if(n===w)break;w=n;}
  wrap.style.width=w+'px';wrap.classList.toggle('narrow',w<700);}
let titleOpen=false;
function shrinkToFit(){if(!titleOpen)return;const p=$('panel'),c=p.firstElementChild;if(!c)return;c.style.zoom='';if($('wrap').classList.contains('narrow'))return;const room=p.clientHeight-40;if(c.offsetHeight>room)c.style.zoom=Math.max(0.55,room/c.offsetHeight).toFixed(3);}
window.addEventListener('resize',()=>{fit();shrinkToFit();});fit();
$('fs').addEventListener('click',()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{$('fs').hidden=true;});});
document.addEventListener('fullscreenchange',()=>{$('fs').textContent=document.fullscreenElement?'Avslutt fullskjerm':'Fullskjerm';fit();shrinkToFit();});
if(!document.documentElement.requestFullscreen)$('fs').hidden=true;
function title(){showPanel('<div class="tcols"><canvas id="banner" width="192" height="72" aria-hidden="true"></canvas><div class="tbody"><h1>BYRÅET</h1><p style="font-size:24px;margin:2px 0 6px">En arbeidsdag hos Fjordvik Regnskap AS</p><label for="pname">Navn eller kandidatnummer (valgfritt)</label><input type="text" id="pname" maxlength="60" autocomplete="off"><div class="row"><button class="btn" id="go" type="button">Start dagen ▶</button></div><p class="sub">Gå med piltaster eller WASD, eller klikk dit du vil gå. Snakk og bruk ting med E eller mellomrom.</p><p class="sub">En runde tar 20–30 minutter. Sakene trekkes tilfeldig, så dagene blir ulike. Prøveversjon: fagstoffet er ikke kvalitetssikret.</p></div></div>',true);drawBanner();titleOpen=true;shrinkToFit();setTimeout(shrinkToFit,700);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(shrinkToFit);
  $('go').addEventListener('click',()=>{playerName=$('pname').value.trim();titleOpen=false;sfx.open();hidePanel();started=true;day();});}
requestAnimationFrame(frame);
if(location.hash==='#demo'){started=true;P.x=P.tx=20;P.y=P.ty=5;npcs[2].present=true;setClock(600);setObj('Møt Selma Aune på møterommet til venstre','kunde');choose('du','Selma ser spent på deg. Hva anbefaler du?',['Jeg anbefaler aksjeselskap.','Jeg anbefaler enkeltpersonforetak.','Dette kan jeg ikke gi råd om. Du bør snakke med en advokat.']);}
else{const hm=location.hash.match(/^#scene-(\w+)-(\w+)$/);if(hm&&SCENES[hm[1]]){started=true;setClock(+hm[2]);say(hm[1],'Hei! Jeg skal åpne bakeri i sentrum, Aune Surdeig. Naboen min sier at jeg må ha AS fordi det gir lavere skatt. Stemmer det?');}else title();}
})();
</script>
